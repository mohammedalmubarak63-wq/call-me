<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Secure Phone Hub</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #fff; --primary: #2563eb; --secondary: #059669; --danger: #dc2626; --warning: #d97706; --text-dim: #94a3b8; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; box-sizing: border-box; }
        .container { max-width: 600px; margin: auto; }
        .section { background: var(--card); padding: 18px; border-radius: 14px; margin-bottom: 16px; border: 1px solid var(--border); }
        .section h2 { font-size: 16px; margin-top: 0; color: #f8fafc; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .controls { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .group { flex: 1; min-width: 140px; }
        input, textarea { width: 100%; background: var(--bg); color: white; border: 1px solid #475569; padding: 10px; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 10px 16px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 6px; }
        button.secondary { background: var(--secondary); }
        button.danger { background: var(--danger); }
        button.warning { background: var(--warning); }
        .output-box { background: var(--bg); padding: 10px; border-radius: 8px; margin-top: 10px; min-height: 50px; border: 1px solid var(--border); font-size: 13px; line-height: 1.4; word-break: break-word; color: #e2e8f0; }
        .call-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.98); z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .call-card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid #475569; text-align: center; width: 100%; max-width: 420px; }
        .video-container { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; position: relative; }
        video { width: 100%; max-height: 200px; background: #000; border-radius: 8px; object-fit: cover; display: none; }
        .pairing-badge { background: #0284c7; color: white; font-weight: bold; padding: 6px; border-radius: 8px; font-size: 14px; letter-spacing: 2px; margin: 8px 0; border: 1px dashed #38bdf8; }
        .contact-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding: 8px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="section" id="authSection">
            <h2>🔐 تسجيل الجوال وتشغيل الهوية</h2>
            <div id="phoneStep">
                <input type="text" id="verifyPhoneInput" placeholder="أدخل رقمك (مثال: 0501234567)" style="margin-bottom:8px;">
                <button onclick="registerDeviceKey()">تفعيل الاتصال والهوية</button>
            </div>
            <div id="verifiedBadge" style="display:none; text-align: center; color: #059669; font-weight: bold;">
                ✅ متصل وجاهز برقم: <span id="confirmedPhone" style="color: #38bdf8;"></span>
            </div>
        </div>

        <div id="mainAppContent" style="display:none;">
            <div class="section">
                <h2>👥 جهات الاتصال</h2>
                <div class="controls">
                    <div class="group"><input type="text" id="contactName" placeholder="الاسم"></div>
                    <div class="group"><input type="text" id="contactPhone" placeholder="رقم الجوال"></div>
                </div>
                <button class="secondary" onclick="saveContact()">➕ حفظ جهة الاتصال</button>
                <div class="output-box" id="contactsList" style="max-height: 100px; overflow-y: auto; margin-top: 10px;">لا توجد جهات اتصال.</div>
            </div>

            <div class="section">
                <h2>📞 الاتصال المباشر</h2>
                <div class="controls">
                    <div class="group"><input type="text" id="targetPhoneInput" placeholder="رقم الطرف الآخر"></div>
                </div>
                <div class="controls">
                    <button onclick="startCall('audio')">📞 اتصال صوتي</button>
                    <button class="secondary" onclick="startCall('video')">📹 اتصال فيديو</button>
                </div>
            </div>

            <div class="section">
                <h2>💬 المحادثة مع: <span id="activeChatName" style="color:#38bdf8;">اختر شخصاً</span></h2>
                <textarea id="chatInput" placeholder="اكتب رسالة..."></textarea>
                <input type="file" id="imageInput" accept="image/*" style="margin-top: 8px;">
                <button onclick="sendChatMessage()" style="margin-top: 8px;">📤 إرسال المراسلة</button>
                <div class="output-box" id="chatHistory" style="max-height: 140px; overflow-y: auto; margin-top: 10px;">اختر جهة اتصال...</div>
            </div>
        </div>
    </div>

    <div class="call-overlay" id="callOverlay">
        <div class="call-card">
            <h3 id="callTitle">جاري الاتصال...</h3>
            <p id="callStatusText" style="color: var(--text-dim); font-size: 13px; margin-bottom: 5px;">انتظار الطرف الآخر...</p>
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
                <video id="localVideo" autoplay playsinline muted style="width: 70px; height: 50px; position: absolute; bottom: 5px; right: 5px; border: 1px solid #38bdf8;"></video>
            </div>
            <div id="pairingCodeBox" style="display:none;">
                <div style="font-size:12px; color:var(--text-dim);">رمز الاقتران المشترك:</div>
                <div class="pairing-badge" id="pairingCodeDisplay">----</div>
            </div>
            <div id="incomingActions" style="display:none; margin-bottom: 10px;">
                <button class="secondary" onclick="acceptIncomingCall()" style="margin-bottom:6px;">🟢 رد الآن</button>
                <button class="warning" onclick="quickSaveCaller()" style="margin-bottom:6px;">➕ حفظ المتصل</button>
            </div>
            <button class="danger" onclick="endCall()">🔴 إنهاء المكالمة</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <script>
        let myPhone = null, activePhone = null, peer = null, currentCall = null, activeDataConn = null, incomingCall = null, incomingPhone = null, localStream = null;

        const iceConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        function registerDeviceKey() {
            const p = document.getElementById('verifyPhoneInput').value.trim();
            if (!p) return alert('أدخل رقم الجوال.');
            myPhone = p;
            localStorage.setItem('verified_phone', myPhone);
            initPeer(myPhone);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('verified_phone');
            if (saved) { myPhone = saved; initPeer(saved); }
            loadContacts();
        });

        function initPeer(phone) {
            document.getElementById('phoneStep').style.display = 'none';
            document.getElementById('verifiedBadge').style.display = 'block';
            document.getElementById('confirmedPhone').innerText = phone;
            document.getElementById('mainAppContent').style.display = 'block';

            if (peer) peer.destroy();
            peer = new Peer("p2pid_" + phone, iceConfig);

            peer.on('call', (call) => {
                incomingCall = call;
                incomingPhone = call.peer.replace('p2pid_', '');
                document.getElementById('pairingCodeDisplay').innerText = genCode(myPhone, incomingPhone);
                document.getElementById('pairingCodeBox').style.display = 'block';
                document.getElementById('callTitle').innerText = 'مكالمة واردة من: ' + incomingPhone;
                document.getElementById('callStatusText').innerText = 'ينتظر ردك...';
                document.getElementById('incomingActions').style.display = 'block';
                document.getElementById('callOverlay').style.display = 'flex';
            });

            peer.on('connection', (conn) => {
                activeDataConn = conn;
                setupDataConn(conn);
            });
        }

        function genCode(a, b) {
            const str = [a, b].sort().join('-');
            let h = 0;
            for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
            return Math.abs(h % 9000 + 1000).toString();
        }

        function setupDataConn(conn) {
            conn.on('data', (data) => {
                const sender = conn.peer.replace('p2pid_', '');
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                let key = 'chat_' + sender;
                let history = JSON.parse(localStorage.getItem(key) || '[]');
                if (data.type === 'text') {
                    history.push(`<div><b>${sender} (${time}):</b> ${data.content}</div>`);
                } else if (data.type === 'image') {
                    history.push(`<div><b>${sender} (${time}) [Image]:</b><br><img src="${data.content}" style="max-width:120px; border-radius:6px;"></div>`);
                }
                localStorage.setItem(key, JSON.stringify(history));
                if (activePhone === sender) loadChatHistory();
            });
        }

        function saveContact() {
            const name = document.getElementById('contactName').value.trim();
            const phone = document.getElementById('contactPhone').value.trim();
            if (!name || !phone) return alert('أدخل الاسم والرقم.');
            let contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
            contacts.push({ name, phone });
            localStorage.setItem('contacts', JSON.stringify(contacts));
            document.getElementById('contactName').value = '';
            document.getElementById('contactPhone').value = '';
            loadContacts();
        }

        function loadContacts() {
            const div = document.getElementById('contactsList');
            let contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
            if (contacts.length === 0) { div.innerText = 'لا توجد جهات اتصال.'; return; }
            div.innerHTML = '';
            contacts.forEach(c => {
                div.innerHTML += `<div class="contact-item">
                    <span onclick="selectContact('${c.name}', '${c.phone}')"><b>${c.name}</b> (${c.phone})</span>
                    <button style="width:auto; padding:4px 8px; font-size:12px;" onclick="quickCall('${c.phone}')">اتصال</button>
                </div>`;
            });
        }

        function quickCall(p) { document.getElementById('targetPhoneInput').value = p; startCall('audio'); }
        function selectContact(name, phone) {
            activePhone = phone;
            document.getElementById('activeChatName').innerText = `${name} (${phone})`;
            if (peer) {
                activeDataConn = peer.connect("p2pid_" + phone, iceConfig);
                setupDataConn(activeDataConn);
            }
            loadChatHistory();
        }

        async function startCall(type) {
            const target = document.getElementById('targetPhoneInput').value.trim();
            if (!target) return alert('أدخل رقم الطرف الآخر.');
            document.getElementById('pairingCodeDisplay').innerText = genCode(myPhone, target);
            document.getElementById('pairingCodeBox').style.display = 'block';
            document.getElementById('callTitle').innerText = 'جاري الاتصال بـ: ' + target;
            document.getElementById('callStatusText').innerText = 'رنين...';
            document.getElementById('incomingActions').style.display = 'none';
            document.getElementById('callOverlay').style.display = 'flex';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === 'video' });
                if (type === 'video') {
                    const lVid = document.getElementById('localVideo');
                    lVid.srcObject = localStream;
                    lVid.style.display = 'block';
                }
                currentCall = peer.call("p2pid_" + target, localStream, iceConfig);
                currentCall.on('stream', (stream) => {
                    document.getElementById('callStatusText').innerText = 'المكالمة نشطة 🟢';
                    const rVid = document.getElementById('remoteVideo');
                    rVid.srcObject = stream;
                    rVid.style.display = 'block';
                });
                currentCall.on('close', () => endCall());
            } catch (e) {
                alert('خطأ في الوصول للميكروفون/الكاميرا.');
                endCall();
            }
        }

        async function acceptIncomingCall() {
            document.getElementById('callStatusText').innerText = 'توصيل...';
            document.getElementById('incomingActions').style.display = 'none';
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                const lVid = document.getElementById('localVideo');
                lVid.srcObject = localStream;
                lVid.style.display = 'block';

                incomingCall.answer(localStream);
                incomingCall.on('stream', (stream) => {
                    document.getElementById('callStatusText').innerText = 'المكالمة نشطة 🟢';
                    const rVid = document.getElementById('remoteVideo');
                    rVid.srcObject = stream;
                    rVid.style.display = 'block';
                });
            } catch (e) {
                endCall();
            }
        }

        function quickSaveCaller() {
            if (!incomingPhone) return;
            let name = prompt('اسم المتصل:', 'جديد');
            if (!name) return;
            let contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
            contacts.push({ name, phone: incomingPhone });
            localStorage.setItem('contacts', JSON.stringify(contacts));
            loadContacts();
        }

        function endCall() {
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (currentCall) { currentCall.close(); currentCall = null; }
            if (incomingCall) { incomingCall.close(); incomingCall = null; }
            document.getElementById('remoteVideo').style.display = 'none';
            document.getElementById('localVideo').style.display = 'none';
            document.getElementById('callOverlay').style.display = 'none';
            document.getElementById('incomingActions').style.display = 'none';
            document.getElementById('pairingCodeBox').style.display = 'none';
        }

        function loadChatHistory() {
            const div = document.getElementById('chatHistory');
            if (!activePhone) { div.innerText = 'اختر جهة اتصال...'; return; }
            let history = JSON.parse(localStorage.getItem('chat_' + activePhone) || '[]');
            div.innerHTML = history.length ? history.join('<br>') : 'لا توجد رسائل.';
            div.scrollTop = div.scrollHeight;
        }

        function sendChatMessage() {
            if (!activePhone) return alert('اختر جهة اتصال أولاً.');
            const msg = document.getElementById('chatInput').value.trim();
            const file = document.getElementById('imageInput').files[0];
            if (!msg && !file) return;

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let key = 'chat_' + activePhone;
            let history = JSON.parse(localStorage.getItem(key) || '[]');

            if (msg) {
                history.push(`<div><b>أنت (${time}):</b> ${msg}</div>`);
                if (activeDataConn && activeDataConn.open) activeDataConn.send({ type: 'text', content: msg });
                document.getElementById('chatInput').value = '';
            }
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = e.target.result;
                    history.push(`<div><b>أنت (${time}) [Image]:</b><br><img src="${img}" style="max-width:120px; border-radius:6px;"></div>`);
                    if (activeDataConn && activeDataConn.open) activeDataConn.send({ type: 'image', content: img });
                    localStorage.setItem(key, JSON.stringify(history));
                    loadChatHistory();
                    document.getElementById('imageInput').value = '';
                };
                reader.readAsDataURL(file);
                return;
            }
            localStorage.setItem(key, JSON.stringify(history));
            loadChatHistory();
        }
    </script>
</body>
</html>
