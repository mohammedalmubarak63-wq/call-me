<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Secure Hub</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #fff; --primary: #2563eb; --secondary: #059669; --danger: #dc2626; --text-dim: #94a3b8; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; transition: 0.3s; }
        .container { max-width: 650px; margin: auto; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 20px; color: #38bdf8; margin: 0; }
        .lang-btn { background: #334155; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }

        .section { background: var(--card); padding: 18px; border-radius: 14px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid var(--border); }
        .section h2 { font-size: 16px; margin-top: 0; color: #f8fafc; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .group { flex: 1; min-width: 140px; }
        label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
        
        input, textarea { width: 100%; background: var(--bg); color: white; border: 1px solid #475569; padding: 10px; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 60px; }
        
        button { background: var(--primary); color: white; border: none; padding: 10px 16px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 6px; }
        button.secondary { background: var(--secondary); }
        button.danger { background: var(--danger); }
        
        .output-box { background: var(--bg); padding: 10px; border-radius: 8px; margin-top: 10px; min-height: 50px; border: 1px solid var(--border); font-size: 13px; line-height: 1.4; word-break: break-word; color: #e2e8f0; }
        
        /* شاشة المكالمة أو الرنين */
        .call-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.96); z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .call-card { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid #475569; text-align: center; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .call-card h3 { margin-top: 0; color: #38bdf8; font-size: 20px; }
        .info-badge { background: var(--bg); padding: 8px 12px; border-radius: 6px; font-size: 13px; color: #38bdf8; border: 1px solid var(--border); margin-bottom: 10px; }
        
        .contact-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding: 8px 0; }
        .contact-item span { cursor: pointer; }
        .contact-item span:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1 id="uiTitle">P2P Secure Hub</h1>
            <button class="lang-btn" onclick="toggleLanguage()" id="langToggleBtn">English</button>
        </div>

        <!-- معلومات جهازك -->
        <div class="section">
            <h2 id="secInfoTitle">📱 معلومات جهازك ومعرف الاتصال</h2>
            <div class="info-badge">
                <span id="txtMyPhoneLbl">رقم جوالك:</span> <input type="text" id="myPhone" placeholder="05xxxxxxxx" onchange="saveMyPhone()" style="background:#1e293b; border:1px solid #475569; color:#38bdf8; padding:4px; width:120px; border-radius:4px; display:inline-block; margin-right:6px;">
                <br><span id="myPeerIdDisplay" style="font-size: 11px; color: var(--text-dim); margin-top:6px; display:block;">معرف الاتصال الخاص بك: جاري التوليد...</span>
            </div>
        </div>

        <!-- دفتر جهات الاتصال -->
        <div class="section">
            <h2 id="secContactsTitle">👥 جهات الاتصال</h2>
            <div class="controls">
                <div class="group"><input type="text" id="contactName" placeholder="اسم الشخص (مثلاً: زوجتي)"></div>
                <div class="group"><input type="text" id="contactPeerId" placeholder="معرف الطرف الآخر (Peer ID)"></div>
            </div>
            <button class="secondary" onclick="saveContact()" id="btnSaveContact">➕ حفظ جهة الاتصال</button>

            <div class="output-box" id="contactsList" style="max-height: 110px; overflow-y: auto; margin-top: 10px;">لا توجد جهات اتصال محفوظة.</div>
        </div>

        <!-- مركز المكالمات -->
        <div class="section">
            <h2 id="secCallTitle">📞 الاتصال المباشر</h2>
            <div class="controls">
                <div class="group">
                    <input type="text" id="targetPeerInput" placeholder="أدخل معرف الطرف الآخر للاتصال">
                </div>
            </div>
            <div class="controls">
                <button onclick="startCall('audio')" id="btnAudioCall">📞 اتصال صوتي</button>
                <button class="secondary" onclick="startCall('video')" id="btnVideoCall">📹 اتصال فيديو</button>
            </div>
        </div>

        <!-- المحادثة الفورية المعزولة -->
        <div class="section">
            <h2 id="secChatTitle">💬 المحادثة الفورية مع: <span id="activeChatName" style="color:#38bdf8;">العام (الكل)</span></h2>
            <textarea id="chatInput" placeholder="اكتب رسالة..."></textarea>
            <input type="file" id="imageInput" accept="image/*" style="margin-top: 8px;">
            <button onclick="sendChatMessage()" style="margin-top: 8px;" id="btnSend">📤 إرسال رسالة أو صورة</button>

            <div class="output-box" id="chatHistory" style="max-height: 160px; overflow-y: auto; margin-top: 10px;">اختر جهة اتصال لبدء محادثة خاصة ومغلقة...</div>
        </div>
    </div>

    <!-- شاشة الاتصال النشط أو الرنين (تفاعلية مع خيار الحفظ السريع) -->
    <div class="call-overlay" id="callOverlay">
        <div class="call-card">
            <h3 id="callTitle">مكالمة واردة...</h3>
            <p id="callStatusText" style="color: var(--text-dim); font-size: 13px; margin-bottom: 15px;">يرجى الانتظار...</p>
            
            <div id="incomingActions" style="display:none; margin-bottom: 15px;">
                <button class="secondary" onclick="acceptIncomingCall()" style="margin-bottom:6px;" id="btnAccept">🟢 قبول المكالمة</button>
                <button class="warning" onclick="quickSaveCaller()" style="background:#d97706; margin-bottom:6px;" id="btnQuickSave">➕ حفظ المتصل في جهات الاتصال</button>
            </div>
            
            <button class="danger" onclick="endCall()" id="btnEndCall">🔴 إنهاء المكالمة</button>
        </div>
    </div>

    <!-- استدعاء مكتبة PeerJS للاتصال الحقيقي عبر P2P -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

            currentLang = currentLang === 'ar' ? 'en' : 'ar';
