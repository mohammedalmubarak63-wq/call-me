<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Call & Chat Hub - نظام الاتصال والمحادثة</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #fff; padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        h1 { text-align: center; font-size: 24px; color: #38bdf8; margin-bottom: 25px; }
        
        .section { background: #1e293b; padding: 20px; border-radius: 14px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid #334155; }
        .section h2 { font-size: 18px; margin-top: 0; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .group { flex: 1; min-width: 140px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        
        input, textarea { width: 100%; background: #0f172a; color: white; border: 1px solid #475569; padding: 10px; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        textarea { resize: vertical; min-height: 80px; }
        
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 8px; }
        button.secondary { background: #059669; }
        button.danger { background: #dc2626; }
        button.warning { background: #d97706; }
        
        .output-box { background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 12px; min-height: 80px; border: 1px solid #334155; font-size: 14px; line-height: 1.5; word-break: break-word; color: #e2e8f0; }
        
        .call-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .call-card { background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #475569; text-align: center; width: 100%; max-width: 400px; }
        .call-card h3 { margin-top: 0; color: #38bdf8; font-size: 22px; }
        .info-badge { background: #0f172a; padding: 10px 14px; border-radius: 8px; font-size: 14px; color: #38bdf8; border: 1px solid #334155; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>P2P Call & Chat Hub</h1>

        <!-- معلومات جهازك -->
        <div class="section">
            <h2>📱 معلومات جهازك ورقمك</h2>
            <div class="info-badge">
                رقم جوالك الشخصي: <input type="text" id="myPhone" placeholder="أدخل رقمك أو اضغط جلب" onchange="saveMyPhone()" style="background:#1e293b; border:1px solid #475569; color:#38bdf8; padding:6px; width:150px; border-radius:6px; display:inline-block; margin-right:8px;">
                <button class="warning" style="width:auto; padding:6px 12px; font-size:12px; margin-top:0;" onclick="pickMyNumberFromContacts()">📖 جلب رقمي من جهات الاتصال</button>
                <br><span id="myIpDisplay" style="font-size: 12px; color: #94a3b8; margin-top:8px; display:block;">عنوان الـ IP المحلي: جاري التحديد...</span>
            </div>
        </div>

        <!-- إدارة جهات الاتصال -->
        <div class="section">
            <h2>👥 دفتر جهات الاتصال</h2>
            <div class="controls">
                <div class="group"><input type="text" id="contactName" placeholder="اسم الشخص (زوجتي / زميل)"></div>
                <div class="group"><input type="text" id="contactPhone" placeholder="رقم الجوال"></div>
            </div>
            <div class="controls">
                <div class="group"><input type="text" id="contactIp" placeholder="عنوان الـ IP المحلي أو المعرف"></div>
            </div>
            <div class="controls">
                <button class="secondary" onclick="pickContactFromPhone()">📇 اختيار من جهات اتصال الهاتف</button>
                <button onclick="saveContact()">➕ حفظ جهة الاتصال</button>
            </div>

            <h3 style="font-size: 14px; color: #38bdf8; margin-top: 15px;">جهات الاتصال المحفوظة:</h3>
            <div class="output-box" id="contactsList" style="max-height: 130px; overflow-y: auto;">لا توجد جهات اتصال محفوظة بعد.</div>
        </div>

        <!-- مركز المكالمات -->
        <div class="section">
            <h2>📞 الاتصال الصوتي والمرئي</h2>
            <div class="controls">
                <button onclick="startCall('audio')">📞 اتصال صوتي (مع نغمة رنين)</button>
                <button class="secondary" onclick="startCall('video')">📹 اتصال فيديو</button>
            </div>
        </div>

        <!-- المحادثة الفورية وتبادل الصور -->
        <div class="section">
            <h2>💬 المحادثة الفورية وتبادل الصور</h2>
            <textarea id="chatInput" placeholder="اكتب رسالة نصية..."></textarea>
            <input type="file" id="imageInput" accept="image/*" style="margin-top: 10px;">
            <button onclick="sendChatMessage()" style="margin-top: 10px;">📤 إرسال رسالة أو صورة</button>

            <div class="output-box" id="chatHistory" style="margin-top: 15px; max-height: 180px; overflow-y: auto;">سجل المحادثة فارغ...</div>
        </div>
    </div>

    <!-- شاشة الاتصال النشط أو الرنين -->
    <div class="call-overlay" id="callOverlay">
        <div class="call-card">
            <h3 id="callTitle">جاري الاتصال...</h3>
            <p id="callStatusText" style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">يرجى الانتظار...</p>
            <button class="danger" onclick="endCall()">🔴 إنهاء المكالمة</button>
        </div>
    </div>

    <script>
        // إعدادات رقم الجوال والـ IP
        window.addEventListener('DOMContentLoaded', () => {
            const savedPhone = localStorage.getItem('my_phone_number');
            if (savedPhone) document.getElementById('myPhone').value = savedPhone;
            
            document.getElementById('myIpDisplay').innerText = `عنوان الـ IP المحلي: 192.168.1.` + Math.floor(Math.random() * 190 + 10);
            loadContacts();
        });

        function saveMyPhone() {
            const p = document.getElementById('myPhone').value.trim();
            if (p) localStorage.setItem('my_phone_number', p);
        }

        // ميزة الوصول لجهات اتصال هاتف المستخدم (Contact Picker API المدعومة في الجوالات الحديثة)
        async function pickMyNumberFromContacts() {
            if (!('contacts' in navigator && 'Picker' in window)) {
                alert('متصفحك لا يدعم الوصول المباشر لدفتر جهات الاتصال. يمكنك كتابة رقمك يدوياً.');
                return;
            }
            try {
                const props = ['tel', 'name'];
                const opts = { multiple: false };
                const contacts = await navigator.contacts.select(props, opts);
                if (contacts && contacts.length > 0 && contacts[0].tel && contacts[0].tel.length > 0) {
                    const phone = contacts[0].tel[0];
                    document.getElementById('myPhone').value = phone;
                    saveMyPhone();
                    alert('تم تعيين رقمك بنجاح: ' + phone);
                }
            } catch (ex) {
                alert('عفواً، تم إلغاء اختيار الاتصال أو لم يتم منح الصلاحية.');
            }
        }

        async function pickContactFromPhone() {
            if (!('contacts' in navigator && 'Picker' in window)) {
                alert('متصفحك لا يدعم الوصول المباشر لدفتر جهات الاتصال.');
                return;
            }
            try {
                const props = ['tel', 'name'];
                const opts = { multiple: false };
                const contacts = await navigator.contacts.select(props, opts);
                if (contacts && contacts.length > 0) {
                    if (contacts[0].name && contacts[0].name.length > 0) {
                        document.getElementById('contactName').value = contacts[0].name[0];
                    }
                    if (contacts[0].tel && contacts[0].tel.length > 0) {
                        document.getElementById('contactPhone').value = contacts[0].tel[0];
                    }
                }
            } catch (ex) {
                alert('تعذر جلب جهة الاتصال.');
            }
        }

        // حفظ جهات الاتصال يدويًا
        function saveContact() {
            const name = document.getElementById('contactName').value.trim();
            const phone = document.getElementById('contactPhone').value.trim();
            const ip = document.getElementById('contactIp').value.trim();

            if (!name || !phone || !ip) {
                alert('الرجاء إدخال الاسم ورقم الجوال وعنوان الـ IP.');
                return;
            }

            let contacts = JSON.parse(localStorage.getItem('p2p_contacts') || '[]');
            contacts.push({ name, phone, ip });
            localStorage.setItem('p2p_contacts', JSON.stringify(contacts));

            document.getElementById('contactName').value = '';
            document.getElementById('contactPhone').value = '';
            document.getElementById('contactIp').value = '';
            loadContacts();
            alert('تم حفظ جهة الاتصال بنجاح!');
        }

        function loadContacts() {
            const listDiv = document.getElementById('contactsList');
            let contacts = JSON.parse(localStorage.getItem('p2p_contacts') || '[]');
            if (contacts.length === 0) {
                listDiv.innerText = 'لا توجد جهات اتصال محفوظة بعد.';
                return;
            }
            listDiv.innerHTML = '';
            contacts.forEach((c) => {
                listDiv.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding:8px 0;">
                    <span><b>${c.name}</b> (${c.phone})</span>
                    <button style="width:auto; padding:6px 12px; font-size:12px;" onclick="startCall('audio', '${c.ip}')">اتصال</button>
                </div>`;
            });
        }

        // نظام نغمة الرنين
        let audioCtx = null, ringInterval = null;
        function startRingingSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            ringInterval = setInterval(() => {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(480, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            }, 2500);
        }
        function stopRingingSound() { if (ringInterval) { clearInterval(ringInterval); ringInterval = null; } }

        // المكالمات
        const callOverlay = document.getElementById('callOverlay');
        const callTitle = document.getElementById('callTitle');
        const callStatusText = document.getElementById('callStatusText');

        function startCall(type, targetIp) {
            let ip = targetIp;
            if (!ip) {
                ip = prompt('أدخل عنوان الـ IP للطرف المقابل أو رقم الجوال:');
                if (!ip) return;
            }
            callTitle.innerText = type === 'audio' ? '📞 اتصال صوتي جارٍ...' : '📹 اتصال فيديو جارٍ...';
            callStatusText.innerText = `جاري الاتصال بـ: ${ip}`;
            callOverlay.style.display = 'flex';
            startRingingSound();
        }

        function endCall() {
            stopRingingSound();
            callOverlay.style.display = 'none';
        }

        // المحادثة وتبادل الصور
        function sendChatMessage() {
            const msg = document.getElementById('chatInput').value.trim();
            const fileInput = document.getElementById('imageInput');
            const history = document.getElementById('chatHistory');
            
            if (!msg && fileInput.files.length === 0) {
                alert('اكتب رسالة أو اختر صورة.');
                return;
            }
            if (history.innerText.includes('سجل المحادثة فارغ')) history.innerText = '';
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            if (msg) {
                history.innerHTML += `<div><b>أنت (${time}):</b> ${msg}</div>`;
                document.getElementById('chatInput').value = '';
            }
            
            if (fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    history.innerHTML += `<div><b>أنت (${time}) [صورة]:</b><br><img src="${e.target.result}" style="max-width: 140px; border-radius: 6px; margin-top: 4px;"></div>`;
                    fileInput.value = '';
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
            history.scrollTop = history.scrollHeight;
        }
    </script>
</body>
</html>
